services:
  api:
    build:
      target: development
    volumes:
      - ./product-backend:/src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "1"

  frontend:
    build:
      target: development
    volumes:
      - ./product-frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development